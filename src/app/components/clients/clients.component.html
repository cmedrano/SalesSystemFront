<div class="container mt-4">
  <h2>Clientes</h2>

  <div class="container mt-3">
    <div class=" d-flex align-items-end justify-content-between">
      <div class="col-12 col-md-6 mb-3">
        <label class="form-label fw-semibold">Buscar</label>
        <input type="text" class="form-control" placeholder="Nombre del cliente" [(ngModel)]="searchTerm" />
      </div>

      <div class="col-12 col-md-2 mb-3 d-flex align-items-end justify-content-md-end">
        <button class="btn btn-primary w-100 w-md-auto" (click)="openAddModal()">
          + Agregar
        </button>
      </div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Dirección</th>
        <th>Telefono</th>
        <th>Email</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for ( client of filteredClient(); track $index) {
        <tr>
          <td>{{ client.name }}</td>
          <td>{{ client.lastName }}</td>
          <td>{{ client.address }}</td>
          <td>{{ client.phone }}</td>
          <td>{{ client.email }}</td>
          <td style="margin: 10px">
            <button class="btn btn-success btn-sm me-2" (click)="openEditModal(client)">
              <i class="bi bi-pencil-square"></i>
            </button>
            <button class="btn btn-danger btn-sm ms-2" (click)="openDeleteModal(client)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
