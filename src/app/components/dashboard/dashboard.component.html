<mat-sidenav-container class="sidenav-container">
  <!-- Sidebar -->
  <mat-sidenav mode="side" opened class="sidenav">
    <h3 class="menu-title">Home</h3>
    <mat-nav-list>
      <a class="menu-option" mat-list-item (click)="showSection('dashboard')" [class.active]="currentSection === 'dashboard'">
        <mat-icon>dashboard</mat-icon>
        <span> Dashboard</span>
      </a>
      <a class="menu-option" mat-list-item (click)="showSection('productos')" [class.active]="currentSection === 'productos'">
        <mat-icon>inventory_2</mat-icon>
        <span> Productos</span>
      </a>
      <a class="menu-option" mat-list-item (click)="showSection('clients')" [class.active]="currentSection === 'clients'">
          <mat-icon>person_pin</mat-icon>
          <span> Clientes</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content>
    <div class="content">
      <!-- Dashboard Section -->
      @if(currentSection == 'dashboard'){
      <div class="dashboard-section">
        <h2>Dashboard</h2>
        <div class="cards-grid">
          <mat-card class="card-item" (click)="showSection('productos')">
            <div>
              <mat-icon>inventory_2</mat-icon>
            </div>
            <div>
              <span>Productos</span>
            </div>
          </mat-card>
          <mat-card class="card-item" (click)="showSection('clients')">
            <div class="card-icon">
              <mat-icon>person_pin</mat-icon>
            </div>
            <div class="card-text">
              <span>Clientes</span>
            </div>
          </mat-card>
        </div>
      </div>
      }

      <!-- Productos Section -->
      @if (currentSection === 'productos') {
      <div>
        <app-product-list></app-product-list>
      </div>
      }

      <!-- Clients Section -->
      @if (currentSection === 'clients') {
      <div>
        <app-clients></app-clients>
      </div>
      }

    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
