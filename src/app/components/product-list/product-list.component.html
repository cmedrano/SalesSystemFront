<div class="container mt-4">
  <h2>Productos</h2>

  <div class="container mt-3">
    <div class="row align-items-end">
      <div class="col-12 col-md-6 mb-3">
        <label class="form-label fw-semibold">Buscar</label>
        <input type="text" class="form-control" placeholder="Producto..." [(ngModel)]="searchTerm" />
      </div>

      <div class="col-12 col-md-4 mb-3">
        <label class="form-label fw-semibold">Categorías</label>
        <select class="form-select" [(ngModel)]="selectedCategory">
          <option value="">Todas las categorías</option>
          @for ( cat of categories; track $index) {
            <option [value]="cat.name">
              {{ cat.name }}
            </option>
          }
        </select>
      </div>

      <div class="col-12 col-md-2 mb-3 d-flex align-items-end justify-content-md-end">
        <button class="btn btn-primary w-100 w-md-auto" (click)="openAddModal()">
          + Agregar
        </button>
      </div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Categoría</th>
        <th>Imagen</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for ( p of filteredProducts(); track $index) {
      <tr>
        <td>{{ p.name }}</td>
        <td>{{ p.description }}</td>
        <td>
          @for ( cat of p.categories; track $index) {
            <span>
              {{ cat.name }}
            </span>
          }
          @if (p.categories.length === 0) {
            <span class="text-muted fst-italic">
              Sin categorías
            </span>
          }
        </td>
        <td><img [src]="p.imageUrl" width="80" /></td>
        <td style="margin: 10px">
          <button class="btn btn-success btn-sm me-2" (click)="openEditModal(p)">
            <i class="bi bi-pencil-square"></i>
          </button>
          <button class="btn btn-danger btn-sm ms-2" (click)="openDeleteModal(p)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
